<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">KARMA Ops Monitor</title><desc id="desc">Graphite dashboard illustration with orbiting telemetry nodes</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#182d36"/></linearGradient><linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="1200" height="300" rx="22" fill="url(#bg)"/><g stroke="#34515b" stroke-width="1" opacity=".42"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M100 0V300M200 0V300M300 0V300M400 0V300M500 0V300M600 0V300M700 0V300M800 0V300M900 0V300M1000 0V300M1100 0V300"/></g><circle cx="1000" cy="150" r="106" fill="none" stroke="#3c6470" stroke-width="1.5"/><circle cx="1000" cy="150" r="72" fill="none" stroke="#5eead4" opacity=".4"/><circle cx="1000" cy="150" r="40" fill="#0f2930" stroke="#5eead4"/><path d="M987 151l9 9 19-22" fill="none" stroke="#5eead4" stroke-width="5" stroke-linecap="round"/><g><circle cx="1000" cy="44" r="7" fill="#5eead4"><animateTransform attributeName="transform" type="rotate" from="0 1000 150" to="360 1000 150" dur="12s" repeatCount="indefinite"/></circle></g><text x="66" y="96" fill="#5eead4" font-size="17" font-family="monospace" letter-spacing="5">KARMA SYSTEMS / 01</text><text x="62" y="172" fill="#f1f5f9" font-size="56" font-weight="700" font-family="Arial,sans-serif" letter-spacing="2">OPS MONITOR</text><text x="66" y="216" fill="#94a3b8" font-size="21" font-family="monospace">OBSERVE  ·  VERIFY  ·  IMPROVE</text><path d="M65 247H565" stroke="url(#accent)" stroke-width="3"><animate attributeName="stroke-dasharray" values="0 500;500 0;0 500" dur="8s" repeatCount="indefinite"/></path><style>@media(prefers-reduced-motion:reduce){animate,animateTransform{display:none}}</style></svg>